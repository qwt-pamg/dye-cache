[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
# ── 临时文件不许写 C 盘（用户要求）────────────────────────────────
# 把 pytest 的 tmp_path 根目录定到项目内的 test_temp/pytest/，不再用 %TEMP%。
#
# 为什么需要：pytest 会**保留最近几个会话**的 tmp 目录，实测一次全量跑在
# C:\Users\...\AppData\Local\Temp\pytest-of-<user>\ 下留了 **95.77 MB**。
# 跑几十次就是几个 GB，而且这些目录还持有 run.log 句柄（Windows 上会让目录删不掉）。
#
# ⚠ 两个必须知道的点：
#  1. **目录必须预先存在**——pytest 9 对 --basetemp 不做自动创建，
#     不存在时会直接 `FileNotFoundError: 系统找不到指定的路径` 让所有用例 setup 失败。
#     所以这里指向的 test_temp/pytest 由 tests/conftest.py 在导入时创建。
#  2. `-p no:cacheprovider` 与 --basetemp **可以共存**（已实测：33 passed）。
addopts = --basetemp=test_temp/pytest
# 注：原来这里有 cache_dir = tests/.pytest_cache，pytest 9 已不再识别该选项
# （会打 "Unknown config option: cache_dir" 警告）。缓存目录改用命令行
# -p no:cacheprovider 关掉（tools/check.py 就是这么跑的），或加 --cache-clear。
markers =
    slow: 耗时的端到端用例（内置自检、全流程出图）——默认参与运行，可用 -m "not slow" 跳过
    golden: V2.8 数值金线/兼容红线迁移（FR-55.1/FR-55.3；fast 档必须运行）
    fast: V2.8 fast 档精选集（金线 + 核心单测 + GUI 冒烟级）
filterwarnings =
    ignore::DeprecationWarning
    # matplotlib 缺字形（如 ⁻ / ₀）只是渲染回退，不影响数值与图件断言
    ignore:Glyph \d+ .*missing from font:UserWarning
